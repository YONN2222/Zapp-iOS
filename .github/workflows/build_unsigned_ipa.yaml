name: iOS Build + Unsigned IPA

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (fail on errors)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Zapp.xcodeproj \
            -scheme Zapp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Zapp.xcodeproj \
            -scheme Zapp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Zapp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee archive.log

      - name: Create unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Zapp.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "No .app found in archive"
            exit 1
          fi
          echo "APP_PATH=${APP_PATH}" >> "$GITHUB_ENV"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "${APP_PATH}" build/Payload/
          (cd build && /usr/bin/zip -qry Zapp-unsigned.ipa Payload)

      - name: Zip app bundle for "Designed for iPad" on Mac
        run: |
          set -euo pipefail
          (cd "$(dirname "${APP_PATH}")" && /usr/bin/zip -qry "${GITHUB_WORKSPACE}/build/Zapp-mac.app.zip" "$(basename "${APP_PATH}")")

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapp-unsigned-ipa
          path: build/Zapp-unsigned.ipa
          if-no-files-found: error

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapp-mac-app
          path: build/Zapp-mac.app.zip
          if-no-files-found: error

      - name: Attach builds to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            build/Zapp-unsigned.ipa \
            build/Zapp-mac.app.zip \
            --clobber
